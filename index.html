<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser & User Agent Detector</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        padding: 20px;
    }
    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        max-width: 800px;
        margin: auto;
    }
    h1 {
        text-align: center;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        margin-bottom: 20px;
    }
    td {
        padding: 8px;
        border-bottom: 1px solid #ddd;
    }
    td:first-child {
        font-weight: bold;
        width: 40%;
    }
</style>
</head>

<body>

<div class="card">
    <h1>Browser & User Agent Info</h1>

    <table id="infoTable"></table>
</div>

<div class="card">
    <p>Back Camera</p>
    <input type="file" accept="image/*" capture="environment"/>
    <p>Selfie Camera</p>
    <input type="file" accept="image/*" capture="user"/>
</div>
    
<script>

function getBrowserInfo() {
    const ua = navigator.userAgent;
    let browser = "Unknown";
    let version = "";

    if (ua.includes("Firefox")) {
        browser = "Firefox";
        version = ua.match(/Firefox\/([\d.]+)/)[1];
    } else if (ua.includes("Edg")) {
        browser = "Microsoft Edge";
        version = ua.match(/Edg\/([\d.]+)/)[1];
    } else if (ua.includes("Chrome")) {
        browser = "Chrome";
        version = ua.match(/Chrome\/([\d.]+)/)[1];
    } else if (ua.includes("Safari")) {
        browser = "Safari";
        version = ua.match(/Version\/([\d.]+)/)?.[1] || "";
    }

    return `${browser} ${version}`;
}

function detectOS() {
    const platform = navigator.platform.toLowerCase();
    if (platform.includes("win")) return "Windows";
    if (platform.includes("mac")) return "macOS";
    if (platform.includes("linux")) return "Linux";
    if (/iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase())) return "iOS";
    if (/android/.test(navigator.userAgent.toLowerCase())) return "Android";
    return "Unknown";
}

function isWebGLSupported() {
    try {
        const canvas = document.createElement("canvas");
        return !!(window.WebGLRenderingContext && 
                 (canvas.getContext("webgl") || canvas.getContext("experimental-webgl")));
    } catch (e) {
        return false;
    }
}

function addRow(label, value) {
    const table = document.getElementById("infoTable");
    const row = document.createElement("tr");

    const cell1 = document.createElement("td");
    cell1.textContent = label;

    const cell2 = document.createElement("td");
    cell2.textContent = value;

    row.appendChild(cell1);
    row.appendChild(cell2);
    table.appendChild(row);
}

function loadInfo() {
    addRow("User Agent", navigator.userAgent);
    addRow("Browser", getBrowserInfo());
    addRow("Operating System", detectOS());
    addRow("Platform", navigator.platform);
    addRow("Language", navigator.language);
    addRow("Cookies Enabled", navigator.cookieEnabled);
    addRow("Online Status", navigator.onLine);
    addRow("Java Enabled", navigator.javaEnabled());
    addRow("Touch Support", 'ontouchstart' in window);
    addRow("WebGL Supported", isWebGLSupported());
    addRow("LocalStorage Supported", typeof(Storage) !== "undefined");
    addRow("Dark Mode Preferred", window.matchMedia('(prefers-color-scheme: dark)').matches);

    addRow("Screen Resolution", `${screen.width} x ${screen.height}`);
    addRow("Viewport Size", `${window.innerWidth} x ${window.innerHeight}`);
}

loadInfo();

window.addEventListener("resize", () => {
    location.reload();
});

</script>

</body>
</html>
