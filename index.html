<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Browser & User Agent Detector</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div class="card">
            <h1>Browser & User Agent Info</h1>

            <table id="infoTable"></table>
        </div>

        <div class="card">
            <label for="back-camera">Back Camera</label>
            <input
                id="back-camera"
                type="file"
                accept="image/*"
                capture="environment"
            />
            <label for="selfie-camera">Selfie Camera</label>
            <input
                id="selfie-camera"
                type="file"
                accept="image/*"
                capture="user"
            />
        </div>

        <div class="card">
            <label for="cars">Choose a car</label>
            <select name="cars" id="cars" onchange="handleCarChange(event)">
                <option value="volvo">Volvo</option>
                <option value="saab">Saab</option>
                <option value="mercedes">Mercedes</option>
                <option value="audi">Audi</option>
            </select>
        </div>

        <div class="card">
            <h2>Download Sample File</h2>
            <button class="btn-download" onclick="sendFileToWebView()">
                Download Base64 PDF
            </button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
