<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embed Dailymotion</title>
  </head>
  <body>
    <div
      style="
        position: relative;
        width: 960px;
        height: 540px;
        margin: 0 auto;
        overflow: hidden;
      "
    >
      <iframe
        src="https://geo.dailymotion.com/player.html?video=xav8nce&controls=true"
        width="960"
        height="540"
        style="border: none"
        title="Dailymotion Video Player"
        allowfullscreen
        scrolling="no"
        allow="
          autoplay *;
          encrypted-media *;
          fullscreen *;
          picture-in-picture *;
          web-share *;
        "
      ></iframe>
    </div>
  </body>
</html>
