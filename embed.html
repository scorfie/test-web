<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embed Dailymotion</title>
  </head>
  <body>
    <div
      style="
        position: relative;
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
        padding-bottom: 56.25%;
        height: 0;
        overflow: hidden;
      "
    >
      <iframe
        src="https://geo.dailymotion.com/player.html?video=xav8nce&controls=true"
        style="
          width: 100%;
          height: 100%;
          position: absolute;
          left: 0px;
          top: 0px;
          overflow: hidden;
          border: none;
        "
        title="Dailymotion Video Player"
        allowfullscreen
        allow="web-share; fullscreen"
      ></iframe>
    </div>
  </body>
</html>
